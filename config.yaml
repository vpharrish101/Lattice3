global:
  data_root: "data"
  model_root: "models"
  device: "auto"

GraphTFConv:
  epochs: 10
  checkpoint: "models/GraphTFConv_finetuned.pt"

  dataloader:
    train_batch_size: 4
    val_batch_size: 2
    test_batch_size: 2
    shuffle: true
    num_workers: 0
  data_root: "src/data"

  optimizer:
    type: "AdamW"
    lr: 0.00015
    weight_decay: 0.0001

  scheduler:
    type: "CosineAnnealingLR"
    T_max: 10

  loss: "CrossEntropyLoss"


ProtBERT:
  model_name: "facebook/esm2_t6_8M_UR50D"
  model_cache_dir: "models"
  data_root: "src/data"

  dataloader:
    batch_size: 6
    shuffle: false
    num_workers: 4

  max_len: 1024
  autocast_dtype: "float16"



ViT_embed:
  checkpoint: "models/ViT_finetuned.pt"
  data_root: "src/data"

  dataloader:
    batch_size: 32



ViT_train:
  epochs: 5
  data_root: "src/data"
  checkpoint: "models/ViT_finetuned.pt"

  backbone:
    name: "vit_small_patch16_224"
    pretrained: true
    unfreeze_last_blocks: 3

  dataloader:
    train_batch_size: 4
    val_batch_size: 2

  optimizer:
    lr: 0.0003
    weight_decay: 0.05

  num_classes: 4
  projection_dim: 320



Engine:
  global:
    max_len: 1024
    num_classes: 4
    embed_dim: 320

  ViT_train:
    projection_dropout: 0.3

  TFConv:
    in_channels: 320
    heads: 4
    dropout: 0.1
    fusion_dropout: 0.118
    conv_type: "SAGEConv"
    norm_type: "layer_norm"



DataUtils:
  graph:
    dist_threshold: 8.0
    max_residues: 600
    edge_cap: 20000
    granularity: "CA"


Preprocessor:
  graph:
    dist_threshold: 8.0
    max_residues: 600
    edge_cap: 20000
    granularity: "CA"
  data_root: "src/data"

  splits:
    - train
    - val
    - test
